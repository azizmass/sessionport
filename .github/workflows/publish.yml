name: Publish to npm

# Publishes whatever `package.json` says the version is. Tag a release to ship:
#
#   npm version patch   # or minor / major — creates the vX.Y.Z commit and tag
#   git push --follow-tags
#
# `workflow_dispatch` runs the same pipeline manually (useful to retry a failed
# publish without re-tagging).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # npm trusted publishing / provenance attestation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than the bundled one.
      - name: Use a publish-capable npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Check this version is not already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — bump the version first." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Auth: either configure this repo as a trusted publisher on npmjs.com
      # (no secret needed), or add an automation token as the NPM_TOKEN secret.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
